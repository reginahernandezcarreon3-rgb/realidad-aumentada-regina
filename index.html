<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

  <a-assets>
    <a-asset-item id="miModelo" src="modelo.glb"></a-asset-item>
  </a-assets>

  <!-- PRIMER MARCADOR: HIRO -->
  <a-marker preset="hiro">

    <a-entity
      gltf-model="#miModelo"
      scale="1 1 1"
      position="0 0 0"
      rotation="-90 0 0">
    </a-entity>

    <a-text
      value="¡Mi primera AR!"
      align="center"
      color="#FFFFFF"
      position="0 1.5 0"
      scale="0.5 0.5 0.5">
    </a-text>

  </a-marker>


  <!-- SEGUNDO MARCADOR: KANJI -->
  <a-marker preset="kanji">

    <a-sphere
      position="0 0.5 0"
      radius="0.5"
      color="#2196F3">
    </a-sphere>

    <a-text
      value="¡Segundo marcador!"
      align="center"
      color="#FFFFFF"
      position="0 1.5 0"
      scale="0.5 0.5 0.5">
    </a-text>

  </a-marker>

  <a-entity camera></a-entity>

</a-scene>

</body>
</html>
