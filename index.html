<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;"> 
<a-assets> 
<a-asset-item id="miModelo" src="modelo.glb"></a-asset-item> 
</a-assets> 
<a-marker preset="hiro">

  <a-entity
    gltf-model="#miModelo"
    scale="0.1 0.1 0.1"
    position="0 0 0"
    rotation="-90 0 0">
  </a-entity>

  <a-text
    value="¡Mi primera AR!"
    align="center"
    color="#FFFFFF"
    position="0 1.5 0"
    scale="2 2 2">
  </a-text>

</a-marker> 
<a-entity camera></a-entity> 
</a-scene> 

</body>
</html>
